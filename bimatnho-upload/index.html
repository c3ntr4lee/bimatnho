<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bí mật 🎁</title>
  <meta name="description" content="Có một món quà nhỏ cho Bae nè 🎁" />
  <meta name="theme-color" content="#ffe6ee" />

  <!-- Ảnh xem trước khi gửi link qua Messenger / Instagram / Zalo.
       Sau khi đưa web lên mạng, đổi og:image thành đường dẫn đầy đủ,
       vd: https://ten-ban.github.io/ten-repo/img/og.jpg -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Bí mật 🎁" />
  <meta property="og:description" content="Có một món quà nhỏ cho Bae nè, mở ra xem đi 🥺" />
  <meta property="og:image" content="https://c3ntr4lee.github.io/bimatnho/img/og.jpg" />
  <meta property="og:url" content="https://c3ntr4lee.github.io/bimatnho/" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/main.css" />
</head>

<body>
  <!-- Nền pastel -->
  <div class="bg" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="floaties" id="floaties" aria-hidden="true"></div>

  <!-- Đang tải -->
  <div id="loader">
    <div class="loader-heart">💗</div>
    <p id="loader-text">Đang gói quà…</p>
    <div class="loader-bar"><i id="loader-fill"></i></div>
  </div>

  <!-- Hộp quà -->
  <section class="scene" id="s-gift">
    <h2 class="gift-title" id="gift-title"></h2>
    <div class="gift" id="gift" role="button" tabindex="0" aria-label="Mở hộp quà">
      <div class="gift-rays"></div>
      <div class="gift-lid"><div class="gift-bow"><i></i><i></i><b></b></div></div>
      <div class="gift-box"></div>
    </div>
    <p class="gift-hint" id="gift-hint"></p>
    <p class="gift-note" id="gift-note"></p>
  </section>

  <!-- Các cảnh của thiệp được tạo bằng JS từ script/config.js -->
  <main id="stage"></main>

  <!-- Nút điều khiển -->
  <div class="controls" id="controls">
    <button id="btn-mute" aria-label="Tắt/bật nhạc">🔊</button>
    <button id="btn-skip" aria-label="Tua nhanh">⏩</button>
    <button id="btn-replay" aria-label="Xem lại từ đầu">↺</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="./script/config.js"></script>
  <script src="./script/main.js"></script>
</body>
</html>
